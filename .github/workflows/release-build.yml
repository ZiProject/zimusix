name: Release Build

# Chạy khi một Release được tạo trên GitHub.
# Có thể chạy tay (Actions → Run workflow) để thử build mà không cần tạo Release:
# khi đó file .exe chỉ được đưa vào "Artifacts" của lần chạy, không đính kèm vào Release.
on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write # cần để đính kèm file vào Release

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # app yêu cầu Node >= 20.3; node.exe này cũng được đóng gói vào resources
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # npm install (gốc) + npm install --prefix sidecar
      - name: Setup
        run: npm run setup

      # Chuẩn bị resources (sidecar + node_modules + node.exe + ffmpeg) = `npm run bundle`.
      # Tách riêng khỏi beforeBuildCommand để còn dọn symlink/junction trước khi Tauri quét
      # `resources/**/*` (npm ci trên Windows có thể tạo node_modules/zimusix trỏ ngược về
      # thư mục gốc repo → vòng lặp vô hạn, lỗi "resource path ... doesn't exist").
      - name: Bundle sidecar resources
        run: npm run bundle

      - name: Remove symlinks/junctions from resources
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            let n = 0;
            const walk = (dir) => {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (fs.lstatSync(p).isSymbolicLink()) {
                  console.log("removing link: " + p + " -> " + fs.readlinkSync(p));
                  try { fs.unlinkSync(p); } catch { fs.rmdirSync(p); }
                  n++;
                } else if (e.isDirectory()) walk(p);
              }
            };
            walk("src-tauri/resources");
            console.log("removed " + n + " link(s)");
          '

      # `npm run bundle` đã chạy ở trên nên ghi đè beforeBuildCommand chỉ còn build frontend.
      - name: Write CI Tauri config
        run: echo '{"build":{"beforeBuildCommand":"npm run web:build"}}' > src-tauri/tauri.ci.conf.json

      # Hiện tại chỉ build file .exe để test: --no-bundle bỏ qua bước đóng gói
      # (.msi, .nsis, .deb, .AppImage). Khi cần build đầy đủ, hãy comment dòng
      # `--no-bundle` và bỏ comment dòng `npm run build ...` bên dưới.
      - name: Build (tauri build)
        run: npm run build -- --no-bundle --config src-tauri/tauri.ci.conf.json
        # run: npm run build -- --config src-tauri/tauri.ci.conf.json

      - name: Prepare release asset
        id: asset
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          EXE="src-tauri/target/release/zimusix.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::Không tìm thấy $EXE sau khi build"
            ls -la src-tauri/target/release || true
            exit 1
          fi
          NAME="Zimusix_${TAG:-dev}_x64.exe"
          mkdir -p dist-release
          cp "$EXE" "dist-release/$NAME"
          echo "path=dist-release/$NAME" >> "$GITHUB_OUTPUT"
          ls -la dist-release

      # --- Đính kèm vào Release (chỉ khi chạy từ sự kiện release) ---
      # Các bản đóng gói khác đang tắt. Khi cần, dùng `npm run build` (không --no-bundle)
      # và thêm vào danh sách `files` bên dưới:
      #   src-tauri/target/release/bundle/msi/*.msi
      #   src-tauri/target/release/bundle/nsis/*.exe
      #   src-tauri/target/release/bundle/deb/*.deb
      #   src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Upload .exe to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ steps.asset.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Chạy tay: chỉ lưu vào Artifacts để kiểm tra ---
      - name: Upload .exe as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zimusix-windows-exe
          path: ${{ steps.asset.outputs.path }}
          if-no-files-found: error
