name: Release Build and Attach Artifacts

on:
  release:
    types: [created, edited]

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write # needed to upload release assets

    steps:
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      - name: Enable long paths (Git)
        run: git config --system core.longpaths true

      # -------------------------------------------------
      - name: Install Rust toolchain (x86_64-pc-windows-msvc)
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-pc-windows-msvc
          default: true

      # -------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # -------------------------------------------------
      - name: Install root npm deps
        run: npm ci

      # -------------------------------------------------
      - name: Install side‑car dependencies
        working-directory: src-tauri/resources/sidecar
        run: npm ci

      # -------------------------------------------------
      - name: Run setup script
        run: npm run setup

      # -------------------------------------------------
      - name: Clean previous build artifacts
        run: cargo clean # works from repo root; removes stale Rust outputs

      # -------------------------------------------------
      - name: Build Tauri app
        run: npm run build

      # -------------------------------------------------
      # Collect only .exe artifacts for a quick test build
      - name: Gather build artifacts (only .exe)
        id: gather
        run: |
          echo "::set-output name=files::$( 
            Get-ChildItem -Path "zimusix\\src-tauri\\target\\release\\bundle" -Recurse -Include *.exe |
            ForEach-Object { $_.FullName } |
            Sort-Object -join ';'
          )"

      # -------------------------------------------------
      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.gather.outputs.files }}
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.draft }}
          prerelease: ${{ github.event.release.prerelease }}
